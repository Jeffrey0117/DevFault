<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DevFault</title>
  <style>
    :root {
      --bg-body: #121212;
      --bg-card: #1e1e1e;
      --bg-card-hover: #262626;
      --bg-elevated: #2a2a2a;
      --text-primary: #e2e4e8;
      --text-secondary: #aaa;
      --text-muted: #555;
      --text-dim: #444;
      --border: #252525;
      --border-hover: #333;
      --accent: #d4a054;
      --accent-light: #e0c37e;
      --overlay-bg: rgba(0,0,0,0.75);
      --success: #48bb78;
      --success-glow: rgba(72, 187, 120, 0.35);
      --success-bg: rgba(72, 187, 120, 0.12);
      --success-border: rgba(72, 187, 120, 0.2);
      --danger: #fc8181;
      --danger-bg: rgba(229, 62, 62, 0.12);
      --danger-border: rgba(229, 62, 62, 0.2);
    }
    [data-theme="light"] {
      --bg-body: #f2f2f7;
      --bg-card: #ffffff;
      --bg-card-hover: #f0f0f5;
      --bg-elevated: #e8e8ec;
      --text-primary: #1a1a1a;
      --text-secondary: #666;
      --text-muted: #999;
      --text-dim: #bbb;
      --border: #e0e0e0;
      --border-hover: #ccc;
      --accent: #b8862d;
      --accent-light: #d4a054;
      --overlay-bg: rgba(0,0,0,0.4);
      --success: #34a853;
      --success-glow: rgba(52, 168, 83, 0.3);
      --success-bg: rgba(47, 133, 90, 0.1);
      --success-border: rgba(47, 133, 90, 0.2);
      --danger: #e53e3e;
      --danger-bg: rgba(229, 62, 62, 0.08);
      --danger-border: rgba(229, 62, 62, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: var(--bg-body);
      color: var(--text-secondary);
      padding: 24px 20px;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-btn {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 600;
    }
    .header-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* Tools */
    .tools-bar {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .tool-chip {
      font-size: 10px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }
    .tool-chip.ok {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success-border);
    }
    .tool-chip.missing {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }
    .tool-chip.checking {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .tool-chip.checking::after {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 100% { left: 100%; } }

    /* App Grid */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px 12px;
      padding: 4px 0;
    }

    .app-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .app-cell:active .app-icon-wrap {
      transform: scale(0.9);
    }
    .app-cell.disabled {
      opacity: 0.35;
      cursor: default;
    }
    .app-cell.disabled:active .app-icon-wrap {
      transform: none;
    }

    .app-icon-wrap {
      position: relative;
      width: 60px;
      height: 60px;
      transition: transform 0.12s ease;
    }

    .app-icon {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      object-fit: cover;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }
    .app-icon-fallback {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* Running glow ring */
    .app-cell.running .app-icon-wrap::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 17px;
      border: 2.5px solid var(--success);
      box-shadow: 0 0 12px var(--success-glow);
      animation: glow-pulse 2s ease-in-out infinite;
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 12px var(--success-glow); opacity: 1; }
      50% { box-shadow: 0 0 6px var(--success-glow); opacity: 0.7; }
    }

    /* Running badge dot */
    .app-cell.running .app-icon-wrap::after {
      content: "";
      position: absolute;
      top: -2px;
      right: -2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--success);
      border: 2.5px solid var(--bg-body);
    }

    .app-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: center;
      max-width: 72px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.2;
    }

    /* Footer */
    .footer {
      margin-top: 22px;
      display: flex;
      justify-content: center;
    }
    .btn-sync {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 32px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-sync:hover {
      background: rgba(212, 160, 84, 0.1);
      border-color: rgba(212, 160, 84, 0.3);
    }
    .btn-sync:active { transform: scale(0.97); }
    .btn-sync:disabled { opacity: 0.3; cursor: default; transform: none; }

    /* Loading Overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay-bg);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .loading-overlay.active { display: flex; }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-hover);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loading-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }
    .loading-log {
      width: 80%;
      max-height: 200px;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-hover);
      border-radius: 10px;
      padding: 12px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text"></div>
    <div class="loading-log" id="loading-log"></div>
  </div>

  <div class="header">
    <h1>DevFault</h1>
    <div class="header-right">
      <button class="header-btn" id="theme-btn" onclick="toggleTheme()"></button>
      <button class="header-btn" id="lang-btn" onclick="toggleLang()"></button>
    </div>
  </div>

  <div class="tools-bar" id="tools-bar"></div>
  <div class="app-grid" id="app-grid"></div>

  <div class="footer">
    <button class="btn-sync" id="sync-btn" onclick="syncAll()"></button>
  </div>

  <script>
    const { ipcRenderer } = require("electron")

    const i18n = {
      zh: {
        syncAll: "同步全部",
        syncing: "同步中...",
        syncProgress: "同步中...",
        toggle: "EN",
      },
      en: {
        syncAll: "Sync All",
        syncing: "Syncing...",
        syncProgress: "Syncing...",
        toggle: "中",
      },
    }

    let lang = localStorage.getItem("devfault-lang") || "zh"
    let theme = localStorage.getItem("devfault-theme") || "light"
    let cachedTools = null
    let cachedRepos = []
    let busyApps = new Set()

    function t(key) { return i18n[lang][key] }

    function applyTheme() {
      if (theme === "light") {
        document.documentElement.setAttribute("data-theme", "light")
      } else {
        document.documentElement.removeAttribute("data-theme")
      }
      document.getElementById("theme-btn").textContent = theme === "light" ? "Dark" : "Light"
    }

    function toggleTheme() {
      theme = theme === "light" ? "dark" : "light"
      localStorage.setItem("devfault-theme", theme)
      applyTheme()
    }

    function applyLang() {
      document.getElementById("lang-btn").textContent = t("toggle")
      document.getElementById("sync-btn").textContent = t("syncAll")
    }

    function toggleLang() {
      lang = lang === "zh" ? "en" : "zh"
      localStorage.setItem("devfault-lang", lang)
      applyLang()
    }

    function renderToolsShimmer(names) {
      const bar = document.getElementById("tools-bar")
      bar.innerHTML = ""
      for (const name of names) {
        const chip = document.createElement("span")
        chip.className = "tool-chip checking"
        chip.textContent = name
        bar.appendChild(chip)
      }
    }

    function renderTools(tools) {
      const bar = document.getElementById("tools-bar")
      bar.innerHTML = ""
      for (const tool of tools) {
        const chip = document.createElement("span")
        chip.className = `tool-chip ${tool.installed ? "ok" : "missing"}`
        chip.textContent = tool.name
        bar.appendChild(chip)
      }
    }

    function renderAppGrid(repos) {
      cachedRepos = repos
      const grid = document.getElementById("app-grid")
      grid.innerHTML = ""

      for (const r of repos) {
        const canRun = r.cloned && r.run
        const cell = document.createElement("div")
        cell.className = "app-cell"
          + (r.running ? " running" : "")
          + (!canRun ? " disabled" : "")

        if (canRun) {
          cell.onclick = () => toggleApp(r.name, r.running)
        }

        const icon = r.logo
          ? `<div class="app-icon-wrap"><img class="app-icon" src="file:///${r.logo.replace(/\\/g, '/')}"></div>`
          : `<div class="app-icon-wrap"><div class="app-icon-fallback">${r.name[0].toUpperCase()}</div></div>`

        cell.innerHTML = `
          ${icon}
          <span class="app-name">${r.name}</span>
        `
        grid.appendChild(cell)
      }
    }

    async function toggleApp(name, isRunning) {
      if (busyApps.has(name)) return
      busyApps.add(name)

      if (isRunning) {
        await ipcRenderer.invoke("stop-project", name)
      } else {
        await ipcRenderer.invoke("run-project", name)
      }

      busyApps.delete(name)
      renderRepos()
    }

    async function fullLoad() {
      const reposPromise = ipcRenderer.invoke("get-repos")
      const toolNamesPromise = ipcRenderer.invoke("get-tool-names")

      const [repos, toolNames] = await Promise.all([reposPromise, toolNamesPromise])
      renderAppGrid(repos)
      renderToolsShimmer(toolNames)

      const tools = await ipcRenderer.invoke("get-tools")
      cachedTools = tools
      renderTools(tools)
    }

    async function renderRepos() {
      const repos = await ipcRenderer.invoke("get-repos")
      if (cachedTools) renderTools(cachedTools)
      renderAppGrid(repos)
    }

    function showOverlay(text) {
      document.getElementById("loading-text").textContent = text
      document.getElementById("loading-log").textContent = ""
      document.getElementById("loading-overlay").classList.add("active")
    }

    function hideOverlay() {
      document.getElementById("loading-overlay").classList.remove("active")
    }

    function appendOverlayLog(line) {
      const log = document.getElementById("loading-log")
      log.textContent += line + "\n"
      log.scrollTop = log.scrollHeight
    }

    async function syncAll() {
      const btn = document.getElementById("sync-btn")
      btn.disabled = true
      btn.textContent = t("syncing")
      showOverlay(t("syncProgress"))

      await ipcRenderer.invoke("sync-all")

      hideOverlay()
      btn.textContent = t("syncAll")
      btn.disabled = false
      fullLoad()
    }

    ipcRenderer.on("sync-progress", (_, line) => appendOverlayLog(line))
    ipcRenderer.on("status-changed", () => renderRepos())

    applyTheme()
    applyLang()
    fullLoad()
  </script>
</body>
</html>
